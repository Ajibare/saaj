<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="SAAJ Partners and Consult">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001534"/>
      <stop offset="0.55" stop-color="#0a2a55"/>
      <stop offset="1" stop-color="#123a75"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="crane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <!-- skyline -->
  <g fill="#ffffff" opacity="0.14">
    <rect x="120" y="470" width="150" height="430"/>
    <rect x="300" y="360" width="110" height="540"/>
    <rect x="440" y="520" width="180" height="380"/>
    <rect x="650" y="300" width="130" height="600"/>
    <rect x="810" y="450" width="90" height="450"/>
    <rect x="930" y="260" width="140" height="640"/>
    <rect x="1100" y="500" width="200" height="400"/>
  </g>
  <g fill="none" stroke="#001534" stroke-width="2" opacity="0.25">
    <line x1="120" y1="470" x2="270" y2="470"/><line x1="300" y1="360" x2="410" y2="360"/>
    <line x1="440" y1="520" x2="620" y2="520"/><line x1="650" y1="300" x2="780" y2="300"/>
    <line x1="930" y1="260" x2="1070" y2="260"/><line x1="1100" y1="500" x2="1300" y2="500"/>
  </g>
  <!-- crane -->
  <g stroke="url(#crane)" stroke-width="6" fill="none" stroke-linecap="round">
    <line x1="360" y1="900" x2="360" y2="330"/>
    <line x1="360" y1="330" x2="1000" y2="250"/>
    <line x1="700" y1="280" x2="700" y2="430"/>
    <line x1="360" y1="520" x2="660" y2="460"/>
    <line x1="700" y1="430" x2="760" y2="430"/>
  </g>
  <g fill="url(#crane)">
    <rect x="320" y="820" width="80" height="80" rx="8"/>
  </g>
  <!-- content -->
  <g transform="translate(0, 0)">
    <rect x="80" y="120" width="18" height="80" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="108" y="140" width="18" height="60" rx="3" fill="#ffffff" opacity="0.6"/>
    <rect x="80" y="220" width="46" height="12" rx="3" fill="#ffffff" opacity="0.4"/>
  </g>
</svg>