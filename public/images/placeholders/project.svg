    <line x1="430" y1="200" x2="590" y2="200"/>
    <line x1="620" y1="380" x2="880" y2="380"/>
  </g>
  <!-- construction draw lines -->
  <g stroke="url(#w)" stroke-width="4" fill="none" stroke-linecap="round">
