  </defs>
  <rect width="1200" height="800" fill="url(#bg2)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <!-- building draft -->
  <g fill="#ffffff" opacity="0.13">
    <rect x="180" y="320" width="220" height="480"/>
    <rect x="430" y="200" width="160" height="600"/>
    <rect x="620" y="380" width="260" height="420"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2">
